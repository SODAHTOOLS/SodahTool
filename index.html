<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SodahTool - 8 Passport Photos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;padding:20px;text-align:center}
.box{max-width:800px;margin:auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#101b38;margin-bottom:15px;font-size:24px}
input[type="file"]{margin:15px 0;font-size:16px}
.btn{background:#1769d2;color:#fff;border:none;padding:12px 22px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}
.btn-green{background:#28a745}
canvas{max-width:100%;height:auto;margin-top:20px;border:1px solid #bbb;background:#fff}
.tip{color:#666;font-size:13px;margin-top:10px}
</style>
</head>
<body>

<div class="box">
  <h1>📸 8 पासपोर्ट फोटो मेकर (4×6 शीट)</h1>
  <p>फोटो अपलोड करें, यह अपने आप पासपोर्ट साइज में फिट होकर 8 फोटो बना देगा।</p>
  
  <input type="file" id="upload" accept="image/*"><br>
  <button class="btn btn-green" onclick="downloadSheet()">फोटो डाउनलोड करें</button>

  <p class="tip">नोट: फोटो फोन की गैलरी में सिर्फ चेहरे और छाती तक क्रॉप करके अपलोड करेंगे तो रिज़ल्ट सबसे अच्छा आएगा।</p>

  <div>
    <canvas id="sheet"></canvas>
  </div>
</div>

<script>
let loadedImg = null;

document.getElementById('upload').addEventListener('change', function(e) {
  let file = e.target.files[0];
  if (!file) return;

  let reader = new FileReader();
  reader.onload = function(event) {
    let img = new Image();
    img.onload = function() {
      loadedImg = img;
      drawPhotos();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

function drawPhotos() {
  let canvas = document.getElementById('sheet');
  let ctx = canvas.getContext('2d');

  // 4x6 inch sheet (Landscape)
  canvas.width = 1800;
  canvas.height = 1200;

  // White Background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let pWidth = 400;
  let pHeight = 500;
  let gapX = 35;
  let gapY = 45;
  let startX = 55;
  let startY = 45;

  // Center crop logic so photo never stretches
  let sWidth = loadedImg.width;
  let sHeight = loadedImg.height;
  let targetRatio = pWidth / pHeight;
  let srcRatio = sWidth / sHeight;

  let sx, sy, sw, sh;
  if (srcRatio > targetRatio) {
    sw = sHeight * targetRatio;
    sh = sHeight;
    sx = (sWidth - sw) / 2;
    sy = 0;
  } else {
    sw = sWidth;
    sh = sWidth / targetRatio;
    sx = 0;
    sy = (sHeight - sh) / 2;
  }

  // 2 rows x 4 columns = 8 Photos
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 4; c++) {
      let x = startX + c * (pWidth + gapX);
      let y = startY + r * (pHeight + gapY);

      ctx.drawImage(loadedImg, sx, sy, sw, sh, x, y, pWidth, pHeight);

      // Border for scissors cutting
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, pWidth, pHeight);
    }
  }
}

function downloadSheet() {
  if (!loadedImg) {
    alert("पहले कोई फोटो सेलेक्ट करें!");
    return;
  }
  let canvas = document.getElementById('sheet');
  let a = document.createElement('a');
  a.download = 'Passport-Photos-8.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>

</body>
</html>
